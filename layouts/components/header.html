<script src="{{ "js/header.js" | relURL }}" defer></script>

<header id="site-masthead" class="site-masthead">
  <div class="header-size">

    <!-- Logo -->
    <div class="header-logo">
      <a href="https://bioconductor.org">
        <img
          src="{{ "images/bioconductor-logo.svg" | relURL }}"
          class="masthead-logo"
          alt="Bioconductor home"
        />
      </a>
    </div>

    <!-- Main navigation -->
    <nav
      id="site-navigation"
      class="header-nav"
      aria-label="Main navigation"
    >
      <div class="nav-links">
        <a
          class="format-bold mobile-link"
          href="{{ "/" | relURL }}"
        >
          Home
        </a>

        <a
          class="format-bold mobile-link"
          href="{{ "resources/resources.html" | relURL }}"
        >
          Resources
        </a>

        <a
          class="format-bold mobile-link"
          href="{{ "workshops/index.html" | relURL }}"
        >
          Workshops
        </a>

        <div class="dropdown">
          <a
            class="format-bold mobile-link"
            href="{{ "collaborations/index.html" | relURL }}"
          >
            Collaborations
          </a>

          <div class="dropdown-content">
            <a
              class="mobile-link"
              href="{{ "collaborations/carpentries/index.html" | relURL }}"
            >
              Carpentries
            </a>

            <a
              class="mobile-link"
              href="{{ "collaborations/physalia/index.html" | relURL }}"
            >
              Physalia
            </a>
          </div>
        </div>
      </div>
    </nav>

    <!-- Mobile menu control -->
    <div class="nav-mobile">
      <span class="format-bold menu-label">Menu</span>

      <button
        class="hamburger"
        type="button"
        aria-label="Open navigation menu"
        aria-controls="site-navigation"
        aria-expanded="false"
      >
        <span class="bar" aria-hidden="true"></span>
        <span class="bar" aria-hidden="true"></span>
        <span class="bar" aria-hidden="true"></span>
      </button>
    </div>

  </div>
</header>
